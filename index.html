<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohtarf | Protection from Internet Risks - الحماية من مخاطر الإنترنت</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2','Cairo',Arial,sans-serif;font-size:22px;line-height:1.6;color:#1b2a5a;background:linear-gradient(135deg,#ffd1f3,#bdeaff,#c9ffd3,#fff2a8,#ffd1f3);background-size:400% 400%;animation:bg 16s ease infinite;min-height:100vh;overflow-x:hidden}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.fl{position:fixed;bottom:-60px;animation:up linear infinite;z-index:0;pointer-events:none;opacity:.85}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:14px}
.a{font-family:'Cairo','Baloo 2',sans-serif}
header{text-align:center;background:#fff;border-radius:30px;padding:14px;box-shadow:0 8px 0 #ffb703;border:4px solid #3a7bd5}
header img{width:130px;animation:bn 2.4s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-8px)}}
h1{margin:4px 0;font-size:34px;color:#e63946}h1 small{display:block;color:#3a7bd5;font-size:30px}
#nmw{margin-top:8px}#nm{font:inherit;font-size:22px;padding:8px 16px;border-radius:20px;border:3px solid #3a7bd5;width:min(420px,90%);text-align:center}
.card{background:#fff;border-radius:28px;margin:22px 0;padding:18px;border:4px solid var(--c);box-shadow:0 8px 0 var(--c)}
.card h2{margin:0 0 10px;text-align:center;color:var(--c);font-size:30px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>div{background:#f8fbff;border-radius:20px;padding:12px 16px;font-size:24px}
.cols ul{margin:0;padding:0 24px}li{margin:8px 0}
.en{direction:ltr;text-align:left}.ar{direction:rtl;text-align:right}
.big{font-size:60px;text-align:center}
.go,.op,.nx{font:inherit;cursor:pointer;border:0;border-radius:24px;padding:12px 24px;color:#fff;font-size:24px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:.15s}
.go:hover,.nx:hover{transform:scale(1.06)}.go:active{transform:translateY(4px);box-shadow:none}
.go{background:var(--c);display:block;margin:14px auto 0}
.ex{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.ex .go{margin:0;font-size:28px;padding:18px 30px}
#ov{position:fixed;inset:0;background:rgba(20,30,80,.7);z-index:50;display:none;overflow:auto;padding:12px}
#bx{max-width:820px;margin:20px auto;background:#fff;border-radius:30px;padding:20px;border:5px solid #ffb703}
.qh{text-align:center;font-weight:800;color:#3a7bd5}.bar{height:14px;background:#e3ecff;border-radius:9px;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#06d6a0,#ffd166);border-radius:9px;transition:.4s}
.qt{font-size:26px;font-weight:800;background:#fff7d6;border-radius:20px;padding:12px 16px;margin:10px 0}
.op{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:10px 0;background:#4361ee;text-align:start}
.op:nth-of-type(2n){background:#f72585}.op:nth-of-type(3n){background:#ff9f1c}.op:nth-of-type(4n){background:#2ec4b6}
.op.ok{background:#06d6a0!important;animation:ok .6s}.op.no{background:#e63946!important;animation:sh .5s}.op:disabled{cursor:default;opacity:.95}
@keyframes ok{50%{transform:scale(1.07)}}@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.fb{text-align:center;font-size:30px;font-weight:800;margin:8px 0}.nx{background:#3a7bd5;display:block;margin:10px auto 0}
.cl{float:right;background:#e63946;border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
.bu{position:fixed;top:65vh;font-size:44px;z-index:99;animation:pop 1.9s ease-out forwards;pointer-events:none}
@keyframes pop{to{transform:translateY(-65vh) rotate(40deg);opacity:0}}
.wa{background:#25d366}
@media(max-width:760px){.cols{grid-template-columns:1fr}body{font-size:20px}h1{font-size:26px}}
</style></head><body>

function snd(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();(ok?[523,659,784,1047]:[220,150]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*(ok?.1:.2);o.type=ok?'triangle':'sawtooth';o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3)})}catch(e){}}

function fin(){const n=S.list.length,p=Math.round(S.sc/n*100),nm=$('#nm').value.trim()||'—',e=p>=90?'🏆':p>=70?'😀':p>=50?'🙂':'💪';snd(p>=50);burst(p>=50);
